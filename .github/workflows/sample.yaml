name: sample things
on: push
jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
    - name: Print date
      run: date
    - name: Print uptime
      run: uptime
  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
    - name: echoing 
      run: echo "hello world"
    
  job-3: 
    runs-on: ubuntu-latest
    needs: job-1
    steps:
    - name: echoing the output
      run: echo "task done..."
